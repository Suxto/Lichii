name: Sync upstream and build

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-renhdrum
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: renhdrum-test
          fetch-depth: 0
      - name: Merge upstream and build when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/zortos293/Lichii.git
          git fetch upstream nx2
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'Already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:renhdrum-test
          gh workflow run release-binaries.yml --ref renhdrum-test -f publish_release=false
